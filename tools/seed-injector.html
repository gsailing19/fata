let hmacKey = '';
let embedPipeline = null;

function log(msg, cls) {
  const el = document.getElementById('log');
  el.innerHTML += `<span class="${cls || 'info'}">${msg}</span>\n`;
  el.scrollTop = el.scrollHeight;
}

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

window.start = async function() {
  const btn = document.getElementById('startBtn');
  btn.disabled = true;
  setStatus('正在加载 embedding 模型...');

  try {
    // Step 1: 加载模型
    log('加载 bge-small-zh-v1.5...');
    embedPipeline = await pipeline('feature-extraction', 'Xenova/bge-small-zh-v1.5');
    log('✓ 模型加载完成', 'ok');

    // Step 2: 获取 HMAC Key
    setStatus('获取 HMAC 密钥...');
    log('获取 HMAC 密钥...');
    const healthResp = await fetch('https://worker.fata.uk/api/health');
    if (!healthResp.ok) {
      log('✗ Worker 不可达', 'err');
      setStatus('失败：Worker 不可达');
      btn.disabled = false;
      return;
    }
    const keyResp = await fetch('https://worker.fata.uk/api/hmac-key', {
      headers: { 'X-Fata-Timestamp': String(Math.floor(Date.now() / 1000)) }
    });
    const keyData = await keyResp.json();
    hmacKey = keyData.hmac_key || '';
    if (!hmacKey) {
      log('✗ HMAC Key 为空', 'err');
      setStatus('失败：HMAC Key 为空');
      btn.disabled = false;
      return;
    }
    log('✓ HMAC Key 获取成功', 'ok');

    // Step 3: 逐条生成 embedding + 加密 + 写入
    let successCount = 0;
    for (let i = 0; i < SEEDS.length; i++) {
      const text = SEEDS[i];
      setStatus(`处理种子 ${i + 1}/${SEEDS.length}...`);

      // 生成 embedding (512-d)
      const embResult = await embedPipeline(text, { pooling: 'mean', normalize: true });
      const embedding = Array.from(embResult.data);

      // 生成 dummy 邮箱
      const dummyEmail = `seed-${i + 1}@fata.internal`;

      // 加密邮箱
      const emailEncrypted = await encryptAES(dummyEmail, hmacKey);
      const emailHash = await sha256(dummyEmail);

      // 加密 embedding
      const embEncrypted = await encryptAES(JSON.stringify(embedding), hmacKey);

      // 取 text_snippet (前 80 字)
      const snippet = text.length > 80 ? text.slice(0, 80) : text;

      // 构建 Issue body
      const body = JSON.stringify({
        e: embEncrypted,
        m: emailEncrypted,
        h: emailHash,
        text_snippet: snippet
      });

      // 构建 HMAC 签名
      const path = '/api/github/issues';
      const ts = String(Math.floor(Date.now() / 1000));
      const msg = `${ts}:${path}`;
      const sig = await hmacSign(msg, hmacKey);

      // 通过 Worker 写入 GitHub Issues
      const createResp = await fetch('https://worker.fata.uk/api/github/issues', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Fata-Signature': sig,
          'X-Fata-Timestamp': ts
        },
        body: JSON.stringify({
          title: `[Seed ${i + 1}] ${snippet.slice(0, 30)}`,
          body,
          labels: ['seed', 'pending']
        })
      });

      if (createResp.ok) {
        log(`✓ 种子 ${i + 1}/${SEEDS.length} 写入成功: "${snippet.slice(0, 30)}..."`, 'ok');
        successCount++;
      } else {
        const errText = await createResp.text();
        log(`✗ 种子 ${i + 1} 失败: ${createResp.status} ${errText}`, 'err');
      }

      // 速率控制：延迟 1s 避免触发 GitHub 次限流
      await sleep(1000);
    }

    log('---', 'info');
    log(`完成！成功 ${successCount}/${SEEDS.length}`, successCount === SEEDS.length ? 'ok' : 'err');
    setStatus(`完成：${successCount}/${SEEDS.length} 条种子已写入`);
  } catch (e) {
    log(`✗ 致命错误: ${e.message}`, 'err');
    setStatus('失败: ' + e.message);
  }
  btn.disabled = false;
};

// ---- 加密工具 ----
async function encryptAES(plaintext, keyStr) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const keyMaterial = await crypto.subtle.importKey('raw',
    new TextEncoder().encode(keyStr).slice(0, 32), { name: 'AES-GCM' }, false, ['encrypt']);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, keyMaterial,
    new TextEncoder().encode(plaintext));
  const combined = new Uint8Array(iv.length + ct.byteLength);
  combined.set(iv);
  combined.set(new Uint8Array(ct), iv.length);
  return btoa(String.fromCharCode(...combined));
}

async function sha256(str) {
  const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function hmacSign(msg, keyStr) {
  const key = await crypto.subtle.importKey('raw',
    new TextEncoder().encode(keyStr), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', key, new TextEncoder().encode(msg));
  return btoa(String.fromCharCode(...new Uint8Array(sig)));
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
