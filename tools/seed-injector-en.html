  "All my friends are getting married and having kids and I feel like I'm on a completely different planet. I'm happy for them but I miss them.",

  "It's been four months and I still check my phone hoping it's them. I know it won't be. I check anyway. When does this stop?",

let encoder, hmacKey, pipe;

async function init() {
  log('Loading ' + MODEL + '...');
  pipe = await pipeline('feature-extraction', MODEL);
  log('Model ready.', 'ok');
  log('Fetching HMAC key...');
  const resp = await fetch(WORKER + '/api/hmac-key');
  const data = await resp.json();
  hmacKey = data.hmac_key;
  if (!hmacKey) { log('HMAC key empty!', 'err'); return false; }
  log('HMAC key ready.', 'ok');
  encoder = new TextEncoder();
  return true;
}

async function encryptAES(plaintext) {
  const keyBytes = encoder.encode(hmacKey).slice(0, 32);
  const key = await crypto.subtle.importKey('raw', keyBytes, { name: 'AES-GCM' }, false, ['encrypt']);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const encoded = encoder.encode(plaintext);
  const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, encoded);
  const combined = new Uint8Array(iv.length + encrypted.byteLength);
  combined.set(iv);
  combined.set(new Uint8Array(encrypted), iv.length);
  return btoa(String.fromCharCode(...combined));
}

async function generateEmbedding(text) {
  const output = await pipe(text, { pooling: 'mean', normalize: true });
  return Array.from(output.data);
}

async function signRequest(endpoint) {
  const ts = Math.floor(Date.now() / 1000).toString();
  const msg = ts + ':' + endpoint;
  const keyData = encoder.encode(hmacKey);
  const key = await crypto.subtle.importKey('raw', keyData, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', key, encoder.encode(msg));
  return {
    'X-Fata-Signature': btoa(String.fromCharCode(...new Uint8Array(sig))),
    'X-Fata-Timestamp': ts
  };
}

async function createSeedIssue(text) {
  const emb = await generateEmbedding(text);
  const embEncrypted = await encryptAES(JSON.stringify(emb));
  const emailEncrypted = await encryptAES('seed@fata.uk');
  const body = JSON.stringify({ e: embEncrypted, m: emailEncrypted, h: '', text_snippet: text.slice(0, 80), lang: LANG });
  const endpoint = '/api/github/issues';
  const headers = { 'Content-Type': 'application/json', ...(await signRequest(endpoint)) };
  const resp = await fetch(WORKER + endpoint, {
    method: 'POST',
    headers,
    body: JSON.stringify({ title: '[Seed EN] ' + text.slice(0, 40), body, labels: ['seed', 'pending'] })
  });
  return resp.ok;
}

function log(msg, cls) {
  const el = document.getElementById('log');
  el.innerHTML += `<span class="${cls || ''}">${msg}</span>\n`;
  el.scrollTop = el.scrollHeight;
}

async function startInjection() {
  document.getElementById('startBtn').disabled = true;
  log('--- Starting English seed injection ---');
  if (!(await init())) return;

  let ok = 0, fail = 0;
  for (let i = 0; i < SEEDS.length; i++) {
    log(`[${i + 1}/${SEEDS.length}] ${SEEDS[i].slice(0, 50)}...`);
    try {
      if (await createSeedIssue(SEEDS[i])) { ok++; log('  OK', 'ok'); }
      else { fail++; log('  Failed', 'err'); }
    } catch (e) { fail++; log('  Error: ' + e.message, 'err'); }
    await new Promise(r => setTimeout(r, 800));
  }

  log(`\nDone. ${ok} OK, ${fail} failed.`);
  document.getElementById('startBtn').disabled = false;
}

window.startInjection = startInjection;
