<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fata — 找到文字频率最接近的陌生人</title>

<!-- CSP -->
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self';
  script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
  style-src 'self' 'unsafe-inline';
  connect-src 'self' https://worker.fata.uk https://api.github.com https://gitee.com;
  img-src 'self' data:;
  font-src 'self';
  worker-src 'self' blob:;
  media-src 'none';
  object-src 'none';">

<style>
/* ===== fata 品牌样式 ===== */
:root {
  --bg: #faf9f6;
  --bg-card: #fff;
  --text: #2a2a2a;
  --text-subtle: #8a8a8a;
  --text-whisper: #bbb;
  --border: #e8e4dc;
  --border-faint: #f0ebe0;
  --accent: #2a2a2a;
  --accent-ghost: rgba(42,42,42,0.06);
  --font-serif: Georgia, 'Noto Serif SC', serif;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --radius: 4px;
  --shadow-card: 0 1px 3px rgba(0,0,0,0.04);
  --max-width: 560px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ===== 布局 ===== */
.page {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 40px 24px 80px;
  min-height: 100vh;
}

/* ===== 首页 ===== */
.landing {
  display: flex; flex-direction: column; align-items: center;
  padding-top: 80px; text-align: center;
}
.landing-title {
  font-family: var(--font-serif);
  font-size: 20px; font-weight: normal; color: var(--text);
  margin-bottom: 40px; line-height: 1.8;
}
.landing-editor {
  width: 100%; max-width: 480px; margin-bottom: 16px;
}
.landing-editor textarea {
  width: 100%; min-height: 160px; padding: 20px 24px;
  font-family: var(--font-serif); font-size: 15px; line-height: 2;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg-card); color: var(--text);
  resize: vertical; outline: none;
  box-shadow: var(--shadow-card);
}
.landing-editor textarea::placeholder {
  color: var(--text-whisper); font-style: italic;
}
/* 起笔提示 */
.writing-prompts {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
  margin-bottom: 24px; max-width: 480px;
}
.writing-prompt {
  font-size: 13px; color: var(--text-subtle); padding: 6px 12px;
  border: 1px solid var(--border-faint); border-radius: 16px;
  cursor: pointer; background: transparent; font-family: var(--font-sans);
}
.writing-prompt:hover { border-color: var(--text-subtle); }

/* 写作启发片段 */
.snippet-scroll {
  margin-bottom: 32px; max-width: 480px; width: 100%;
}
.snippet-item {
  font-family: var(--font-serif); font-size: 13px; color: var(--text-whisper);
  line-height: 1.8; margin-bottom: 12px; font-style: italic;
  text-align: left; padding-left: 12px; border-left: 1px solid var(--border-faint);
}
.snippet-label {
  font-size: 11px; color: var(--text-whisper); text-align: left;
  margin-bottom: 12px; text-transform: none;
}

/* 隐私选择行 */
.privacy-options {
  display: flex; gap: 24px; justify-content: center; margin-bottom: 24px;
  font-size: 13px; color: var(--text-subtle);
}
.privacy-options label { cursor: pointer; display: flex; align-items: center; gap: 6px; }
.privacy-options input[type=checkbox] { accent-color: var(--accent); }

/* 匹配模式选择 */
.match-mode-selector {
  display: flex; gap: 8px; justify-content: center; margin-bottom: 24px;
}
.match-mode-btn {
  font-size: 12px; padding: 6px 14px; border-radius: 16px;
  border: 1px solid var(--border); background: transparent;
  color: var(--text-subtle); cursor: pointer; font-family: var(--font-sans);
}
.match-mode-btn.active {
  background: var(--accent); color: #fff; border-color: var(--accent);
}

/* 投递按钮 */
.btn-deliver {
  font-family: var(--font-serif); font-size: 16px;
  padding: 12px 40px; border: none; border-radius: var(--radius);
  background: var(--accent); color: #fff; cursor: pointer;
  transition: opacity 0.2s;
}
.btn-deliver:hover { opacity: 0.85; }
.btn-deliver:disabled { opacity: 0.4; cursor: not-allowed; }

/* ===== 等待界面 ===== */
.waiting-container {
  display: flex; flex-direction: column; align-items: center;
  padding-top: 80px; text-align: center;
}
.waiting-wave {
  width: 120px; height: 60px; margin-bottom: 32px;
  /* 波形动画 — CSS 简化版 */
  display: flex; align-items: flex-end; justify-content: center; gap: 4px;
}
.wave-bar {
  width: 6px; background: var(--accent); border-radius: 3px;
  animation: wave 1.2s ease-in-out infinite;
}
.wave-bar:nth-child(1) { height: 20px; animation-delay: 0s; }
.wave-bar:nth-child(2) { height: 36px; animation-delay: 0.15s; }
.wave-bar:nth-child(3) { height: 28px; animation-delay: 0.3s; }
.wave-bar:nth-child(4) { height: 44px; animation-delay: 0.45s; }
.wave-bar:nth-child(5) { height: 24px; animation-delay: 0.6s; }
@keyframes wave { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(0.4); } }

.waiting-text { font-family: var(--font-serif); font-size: 16px; color: var(--text); }
.waiting-sub { font-size: 13px; color: var(--text-subtle); margin-top: 8px; }

/* ===== 匹配成功页 ===== */
.match-result { padding-top: 40px; max-width: 480px; margin: 0 auto; }
.resonance-block {
  font-family: var(--font-serif); font-size: 18px; line-height: 2;
  color: var(--text); margin-bottom: 32px; text-align: center;
}
.other-text-block {
  border-left: 2px solid var(--border); padding-left: 16px;
  margin-bottom: 24px;
}
.other-text-label { font-size: 13px; color: var(--text-whisper); margin-bottom: 8px; }
.other-text-content {
  font-family: var(--font-serif); font-size: 14px; font-style: italic;
  color: var(--text-subtle); line-height: 1.9;
}
.email-block {
  background: var(--accent-ghost); padding: 20px 24px; border-radius: var(--radius);
  margin-bottom: 24px; text-align: center;
}
.email-label { font-size: 13px; color: var(--text-whisper); margin-bottom: 6px; }
.email-address {
  font-size: 18px; font-weight: bold; color: var(--text);
  font-family: var(--font-mono, monospace); letter-spacing: 0.5px;
  word-break: break-all;
}
.icebreakers { margin-bottom: 32px; }
.icebreaker-item {
  font-size: 14px; color: var(--text-subtle); line-height: 1.8;
  padding: 8px 0; cursor: pointer; transition: color 0.15s;
}
.icebreaker-item:hover { color: var(--text); }
.icebreaker-label { font-size: 13px; color: var(--text-whisper); margin-bottom: 8px; }

.actions-row { display: flex; gap: 12px; justify-content: center; }
.btn-email {
  font-family: var(--font-serif); font-size: 15px;
  padding: 12px 32px; border-radius: var(--radius);
  background: var(--accent); color: #fff; text-decoration: none; cursor: pointer;
  border: none; display: inline-block;
}
.btn-email:hover { opacity: 0.85; }
.btn-secondary {
  font-size: 14px; padding: 12px 24px; border-radius: var(--radius);
  border: 1px solid var(--border); background: transparent;
  color: var(--text); cursor: pointer; font-family: var(--font-sans);
}

/* ===== 无匹配等待页 ===== */
.no-match {
  display: flex; flex-direction: column; align-items: center;
  padding-top: 80px; text-align: center;
}
.no-match-main {
  font-family: var(--font-serif); font-size: 18px; margin-bottom: 16px;
}
.no-match-sub { font-size: 14px; color: var(--text-subtle); margin-bottom: 32px; }
.echo-snippet {
  font-family: var(--font-serif); font-size: 14px; font-style: italic;
  color: var(--text-whisper); max-width: 400px; line-height: 1.9;
  padding: 16px 20px; border: 1px dashed var(--border-faint);
  border-radius: var(--radius); margin-bottom: 24px;
}

/* ===== AI 采访模式 ===== */
.interview-container { padding-top: 40px; max-width: 480px; margin: 0 auto; }
.interview-messages { margin-bottom: 24px; }
.interview-msg {
  font-size: 15px; line-height: 1.8; margin-bottom: 16px; padding: 12px 16px;
  border-radius: var(--radius); max-width: 85%;
}
.interview-msg.ai {
  background: var(--accent-ghost); color: var(--text);
  margin-right: auto; font-family: var(--font-serif);
}
.interview-msg.user {
  background: var(--bg-card); color: var(--text);
  margin-left: auto; border: 1px solid var(--border-faint);
  text-align: right;
}
.interview-input-row { display: flex; gap: 8px; }
.interview-input {
  flex: 1; padding: 10px 14px; font-size: 14px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg-card); font-family: var(--font-sans);
}
.interview-send {
  padding: 10px 18px; font-size: 14px; border-radius: var(--radius);
  background: var(--accent); color: #fff; border: none; cursor: pointer;
}

/* ===== 回访用户首页 ===== */
.returning-home { padding-top: 40px; max-width: 480px; margin: 0 auto; }
.returning-summary {
  font-family: var(--font-serif); font-size: 16px; margin-bottom: 32px;
  text-align: center; line-height: 1.8;
}
.text-history-item {
  padding: 14px 16px; border: 1px solid var(--border-faint);
  border-radius: var(--radius); margin-bottom: 10px;
  display: flex; justify-content: space-between; align-items: center;
}
.text-history-date { font-size: 12px; color: var(--text-whisper); }
.text-history-topic { font-size: 14px; color: var(--text); }
.text-history-status {
  font-size: 12px; padding: 2px 8px; border-radius: 10px;
}
.status-pending { background: #ddf4e8; color: #1a7f4b; }
.status-matched { background: #e8e0f0; color: #6b4d8a; }
.status-expired { background: #fce4e4; color: #c42e2e; }

/* ===== 加载/进度 ===== */
.model-loading { text-align: center; padding-top: 80px; }
.progress-bar {
  width: 200px; height: 3px; background: var(--border-faint);
  border-radius: 2px; margin: 16px auto; overflow: hidden;
}
.progress-fill {
  height: 100%; background: var(--accent); border-radius: 2px;
  transition: width 0.3s;
}

/* ===== 遮罩 (微信/QQ引导) ===== */
.browser-guide-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000;
}
.browser-guide-box {
  background: var(--bg-card); padding: 32px 28px; border-radius: var(--radius);
  text-align: center; max-width: 320px; font-size: 14px; line-height: 1.8;
}
.browser-guide-box .arrow-icon { font-size: 32px; margin-bottom: 12px; }

/* ===== 底部 ===== */
.footer {
  max-width: var(--max-width); margin: 80px auto 0; padding: 24px 0;
  border-top: 1px solid var(--border-faint); text-align: center;
  font-size: 11px; color: var(--text-whisper); line-height: 2;
}
.footer a { color: var(--text-subtle); }
.footer-resources { margin-top: 8px; color: var(--text-whisper); }

/* ===== 移动端适配 ===== */
@media (max-width: 414px) {
  .page { padding: 24px 16px 60px; }
  .landing { padding-top: 40px; }
  .landing-title { font-size: 17px; }
  .resonance-block { font-size: 16px; }
  .email-address { font-size: 15px; }
  .actions-row { flex-direction: column; }
}
</style>
</head>

<div id="app" class="page"></div>

<footer class="footer" id="page-footer" style="display:none;">
  <p>通信在你自己的邮箱中进行。fata 只是一个引介工具——不存储、不查看、不参与你们的对话。</p>

  </p>

</footer>

<!-- ===== 模块脚本 ===== -->
<script type="module">
  /**
   * fata 主应用 — index.html
   * 加载顺序: config → modules → UI 初始化
   */

  import { ModelLoader } from './modules/model-loader.js';
  import { SafetyHandler } from './modules/safety-handler.js';
  import { LLMFallback } from './modules/llm-fallback.js';
  import { LowSignalGuide } from './modules/low-signal-guide.js';
  import { ResendRetry } from './modules/resend-retry.js';
  import { MatchEngine } from './modules/match-engine.js';

  // ===== 全局状态 =====
  const state = {
    userEmail: null,           // 用户邮箱
    currentText: null,         // 当前编辑的文字
    intentProfile: null,       // LLM 意图解析结果
    matchMode: 'deep',         // 'deep' | 'fast'
    showTextToMatch: true,     // 是否允许展示文字给对方
    isReturningUser: false,    // 是否为回访用户
    modelStatus: 'idle',       // 'idle' | 'loading' | 'ready' | 'fallback'
    pendingTexts: [],          // 历史文字列表
    currentMatch: null,        // 当前匹配结果
    draft: null               // 草稿
  };

  // HMAC 密钥（浏览器端生成，与服务端 HMAC_KEY 相同）
  let HMAC_KEY_RAW = '';

  // ===== 初始化 =====
  async function init() {
    // 检测浏览器环境
    if (isWeChatOrQQ()) {
      showBrowserGuide();
    }

    // 检查草稿
    state.draft = LowSignalGuide.loadDraft();

    // 检查是否为回访用户
    const history = loadFromIndexedDB('fata_history');
    if (history && history.length > 0) {
      state.isReturningUser = true;
      state.pendingTexts = history;
    }

    // 加载模型
    renderModelLoading();
    const result = await ModelLoader.initialize(onModelProgress);

    // 从 Worker 获取 HMAC 密钥（存入 sessionStorage，仅本次会话有效）
    try {
      const keyResp = await fetch('https://worker.fata.uk/api/health');
      if (keyResp.ok) {
        HMAC_KEY_RAW = sessionStorage.getItem('fata_hmac_key') ||
          await _fetchHMACKey();
      }
    } catch (e) {
      console.warn('fata: HMAC key fetch failed, API calls will be unsigned');
    }

    if (result.mode === 'full') {
      state.modelStatus = 'ready';
      await MatchEngine.initialize(result);
    } else {
      state.modelStatus = 'fallback';
      // 在降级模式下初始化（使用 TF-IDF）
      // TODO: 实现 TF-IDF 降级初始化
    }

    // 渲染首页
    renderHome();
  }

  function onModelProgress(pct, text) {
    document.querySelector('.progress-fill').style.width = pct + '%';
    document.querySelector('.progress-text').textContent = text;
  }

  // ===== 页面渲染 =====

  function renderModelLoading() {
    document.getElementById('app').innerHTML = `
      <div class="model-loading">
        <p class="waiting-text">正在准备文字引擎...</p>
        <div class="progress-bar"><div class="progress-fill" style="width:0%"></div></div>
        <p class="waiting-sub progress-text"></p>
      </div>
    `;
  }

  function renderHome() {
    const app = document.getElementById('app');
    document.getElementById('page-footer').style.display = 'block';

    if (state.isReturningUser) {
      renderReturningHome(app);
    } else {
      renderLanding(app);
    }
  }

  function renderLanding(app) {
    app.innerHTML = `
      <div class="landing">
        <h1 class="landing-title">写一段话，找到文字频率最接近的陌生人</h1>

        <div class="landing-editor">
          <textarea id="user-text" placeholder="今天在想什么？"></textarea>
        </div>

        <div class="length-hint" id="length-hint"></div>

        <div class="writing-prompts" id="writing-prompts">
          <button class="writing-prompt" data-text="今天发生了一件让我...">今天发生了一件让我...</button>
          <button class="writing-prompt" data-text="最近一直在想一个问题...">最近一直在想一个问题...</button>
          <button class="writing-prompt" data-text="如果有一个人能理解我...">如果有一个人能理解我...</button>
          <button class="writing-prompt" data-text="随便写点什么，不急">随便写点什么，不急</button>
        </div>

        <div class="snippet-scroll" id="snippet-scroll"></div>

        <div class="privacy-options">
          <label>
            <input type="checkbox" id="show-text-check" checked>
            匹配成功后向对方展示我的文字片段
          </label>
          <label>
            <input type="checkbox" id="allow-snippet-check" checked>
            允许匿名展示我的文字片段（用于写作启发）
          </label>
        </div>

        <div class="match-mode-selector">
          <button class="match-mode-btn active" data-mode="deep">深度匹配（AI 辅助，更精准）</button>
          <button class="match-mode-btn" data-mode="fast">快速匹配（纯本地，更快）</button>
        </div>

        <button class="btn-deliver" id="btn-deliver">投递</button>

        <p style="margin-top:16px;font-size:13px;color:var(--text-whisper);">
          <a href="#" id="interview-link" style="color:var(--text-subtle);">不知道写什么？让 AI 帮你整理</a>
        </p>
      </div>
    `;

    // 事件绑定
    bindLandingEvents();
    loadWritingSnippets();
  }

  function renderReturningHome(app) {
    const active = state.pendingTexts.filter(t => t.status === 'pending').length;
    const matched = state.pendingTexts.filter(t => t.status === 'matched').length;

    const historyHTML = state.pendingTexts.map(t => `
      <div class="text-history-item">
        <div>
          <span class="text-history-date">${formatDate(t.timestamp)}</span>
          <span class="text-history-topic">${t.snippet || '...'}</span>
        </div>
        <span class="text-history-status status-${t.status}">${statusLabel(t.status)}</span>
      </div>
    `).join('');

    app.innerHTML = `
      <div class="returning-home">
        <p class="returning-summary">
          你之前写过 <strong>${state.pendingTexts.length}</strong> 段文字。
          有 <strong>${matched}</strong> 段找到了人，
          <strong>${active}</strong> 段还在等待。
        </p>

        <button class="btn-deliver" id="btn-new-text" style="margin-bottom:32px;">
          写一段新的
        </button>

        <div class="text-history">${historyHTML}</div>
      </div>
    `;

    document.getElementById('btn-new-text').addEventListener('click', () => {
      state.isReturningUser = false;
      renderLanding(app);
    });
  }

  // ===== 事件处理 =====

  function bindLandingEvents() {
    const textarea = document.getElementById('user-text');

    // 起笔提示点击
    document.querySelectorAll('.writing-prompt').forEach(btn => {
      btn.addEventListener('click', () => {
        textarea.value = btn.dataset.text;
        textarea.focus();
        updateLengthHint();
      });
    });

    // 匹配模式切换
    document.querySelectorAll('.match-mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.match-mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.matchMode = btn.dataset.mode;
      });
    });

    // 隐私选项
    document.getElementById('show-text-check').addEventListener('change', e => {
      state.showTextToMatch = e.target.checked;
    });

    // 字数提示
    textarea.addEventListener('input', updateLengthHint);

    // 投递
    document.getElementById('btn-deliver').addEventListener('click', handleDeliver);

    // AI 采访模式
    document.getElementById('interview-link').addEventListener('click', (e) => {
      e.preventDefault();
      startInterview();
    });

    // 恢复草稿
    if (state.draft) {
      textarea.value = state.draft.text;
      updateLengthHint();
      // 清除草稿
      LowSignalGuide.clearDraft();
    }
  }

  function updateLengthHint() {
    const textarea = document.getElementById('user-text');
    const hint = document.getElementById('length-hint');
    if (!textarea || !hint) return;
    const len = textarea.value.trim().length;
    hint.innerHTML = LowSignalGuide.getLengthHintHTML(len);
  }

  async function handleDeliver() {
    const textarea = document.getElementById('user-text');
    const text = textarea.value.trim();

    if (!text) return;

    // 获取或提示输入邮箱
    const email = await getOrAskEmail();
    if (!email) return;

    // Step 1: 信号密度评分 + 安全检测
    const signalResult = await LLMFallback.callWithTimeout('/api/llm/analyze', {
      prompt_type: 'signal_density',
      text_a: text
    });

    // Step 2: 安全检测
    if (signalResult) {
      const safetyDecision = SafetyHandler.handleAnalysis(signalResult, text);

      if (!safetyDecision.shouldCreateIssue) {
        if (safetyDecision.uiState === 'support_resources') {
          showSupportResources(safetyDecision.resources);
        } else if (safetyDecision.uiState === 'rejected') {
          showRejection(safetyDecision);
        }
        return;
      }
    }

    // Step 3: 试探型用户引导
    if (signalResult && signalResult.score) {
      const guideDecision = LowSignalGuide.checkNeedsGuide(text, signalResult);
      if (guideDecision.needsGuide) {
        showLowSignalGuide(text);
        return;
      }
    }

    // Step 4: 执行匹配
    await executeMatch(text, email, signalResult);
  }

  // ===== 匹配流程 =====

  async function executeMatch(text, email, signalResult) {
    showWaiting('正在感受你的文字...');

    // 意图解析（深度匹配模式）
    let intentProfile = null;
    if (state.matchMode === 'deep') {
      const intentResult = await LLMFallback.callWithTimeout('/api/llm/analyze', {
        prompt_type: 'intent_parse',
        text_a: text
      });
      if (intentResult) {
        intentProfile = intentResult;
      }
    }

    showWaiting('正在将你的频率和池子里的文字进行对比...');

    // 匹配
    const matchResult = await MatchEngine.findMatch(
      text,
      await encryptEmail(email),
      intentProfile,
      state.matchMode
    );

    if (matchResult.matched) {
      // 生成共鸣描述
      const resonance = await generateResonance(text, matchResult.matchInfo.otherText);
      showMatchSuccess(matchResult, resonance, text);
    } else {
      showNoMatch(matchResult);
    }
  }

  async function generateResonance(textA, textB) {
    const result = await LLMFallback.callWithTimeout('/api/llm/analyze', {
      prompt_type: 'resonance',
      text_a: textA,
      text_b: textB
    });
    return result || {
      resonance: '你们在此刻的频率很接近。',
      questions: ['你当时在想什么？', '让TA推荐一首歌给你吧。', '告诉TA你那天的感受。']
    };
  }

  async function encryptEmail(email) {
    // 使用 AES-256-GCM 加密，密钥从用户邮箱派生的 PBKDF2 产生
    // 加密后的格式：base64(iv + ciphertext)
    try {
      const key = await _deriveKey(email);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encoder = new TextEncoder();
      const ciphertext = await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv },
        key,
        encoder.encode(email)
      );
      // 拼接 IV + ciphertext
      const combined = new Uint8Array(iv.length + ciphertext.byteLength);
      combined.set(iv);
      combined.set(new Uint8Array(ciphertext), iv.length);
      return btoa(String.fromCharCode(...combined));
    } catch (e) {
      console.error('fata: encryptEmail failed, falling back to plaintext', e);
      return email;
    }
  }

  async function _deriveKey(salt) {
    // 从服务器获取的 HMAC_KEY 作为密钥素材
    // PBKDF2 派生 AES-256 密钥
    const keyMaterial = await crypto.subtle.importKey(
      'raw',
      new TextEncoder().encode(HMAC_KEY_RAW || 'fata-default-encryption-key'),
      'PBKDF2',
      false,
      ['deriveKey']
    );
    return crypto.subtle.deriveKey(
      {
        name: 'PBKDF2',
        salt: new TextEncoder().encode(salt),
        iterations: 100000,
        hash: 'SHA-256'
      },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['encrypt', 'decrypt']
    );
  }

  async function _fetchHMACKey() {
    // 从 Worker 获取 HMAC 密钥（仅一次，存入 sessionStorage）
    try {
      const path = '/api/hmac-key';
      const ts = Math.floor(Date.now() / 1000).toString();
      // 初次请求没有 HMAC 签名（鸡生蛋问题），Worker 的 /api/hmac-key 豁免 HMAC
      const resp = await fetch(`https://worker.fata.uk${path}`, {
        headers: { 'X-Fata-Timestamp': ts }
      });
      if (resp.ok) {
        const data = await resp.json();
        if (data.hmac_key) {
          sessionStorage.setItem('fata_hmac_key', data.hmac_key);
          return data.hmac_key;
        }
      }
    } catch (e) {
      console.warn('fata: could not fetch HMAC key', e);
    }
    return '';
  }
