<style>
/* ===== fata 品牌样式 ===== */
:root {
  --bg: #faf9f6;
  --bg-card: #fff;
  --text: #2a2a2a;
  --text-subtle: #8a8a8a;
  --text-whisper: #bbb;
  --border: #e8e4dc;
  --border-faint: #f0ebe0;
  --accent: #2a2a2a;
  --accent-ghost: rgba(42,42,42,0.06);
  --font-serif: Georgia, 'Noto Serif SC', serif;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --radius: 4px;
  --shadow-card: 0 1px 3px rgba(0,0,0,0.04);
  --max-width: 560px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ===== 布局 ===== */
.page {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 40px 24px 80px;
  min-height: 100vh;
}

/* ===== 首页 ===== */
.landing {
  display: flex; flex-direction: column; align-items: center;
  padding-top: 80px; text-align: center;
}
.landing-title {
  font-family: var(--font-serif);
  font-size: 20px; font-weight: normal; color: var(--text);
  margin-bottom: 40px; line-height: 1.8;
}
.landing-editor {
  width: 100%; max-width: 480px; margin-bottom: 16px;
}
.landing-editor textarea {
  width: 100%; min-height: 160px; padding: 20px 24px;
  font-family: var(--font-serif); font-size: 15px; line-height: 2;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg-card); color: var(--text);
  resize: vertical; outline: none;
  box-shadow: var(--shadow-card);
}
.landing-editor textarea::placeholder {
  color: var(--text-whisper); font-style: italic;
}
.landing-editor textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px rgba(42,42,42,0.1), var(--shadow-card);
  outline: none;
}
/* 起笔提示 */
.writing-prompts {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
  margin-bottom: 24px; max-width: 480px;
}
.writing-prompt {
  font-size: 13px; color: var(--text-subtle); padding: 6px 12px;
  border: 1px solid var(--border-faint); border-radius: 16px;
  cursor: pointer; background: transparent; font-family: var(--font-sans);
}
.writing-prompt:hover { border-color: var(--text-subtle); }

/* 写作启发片段 */
.snippet-scroll {
  margin-bottom: 32px; max-width: 480px; width: 100%;
}
.snippet-item {
  font-family: var(--font-serif); font-size: 13px; color: var(--text-whisper);
  line-height: 1.8; margin-bottom: 12px; font-style: italic;
  text-align: left; padding-left: 12px; border-left: 1px solid var(--border-faint);
}
.snippet-label {
  font-size: 11px; color: var(--text-whisper); text-align: left;
  margin-bottom: 12px; text-transform: none;
}

/* 隐私选择行 */
.privacy-options {
  display: flex; gap: 24px; justify-content: center; margin-bottom: 24px;
  font-size: 13px; color: var(--text-subtle);
}
.privacy-options label { cursor: pointer; display: flex; align-items: center; gap: 6px; }
.privacy-options input[type=checkbox] { accent-color: var(--accent); }

/* 匹配模式选择 */
.match-mode-selector {
  display: flex; gap: 8px; justify-content: center; margin-bottom: 24px;
}
.match-mode-btn {
  font-size: 12px; padding: 6px 14px; border-radius: 16px;
  border: 1px solid var(--border); background: transparent;
  color: var(--text-subtle); cursor: pointer; font-family: var(--font-sans);
}
.match-mode-btn.active {
  background: var(--accent); color: #fff; border-color: var(--accent);
}

/* 投递按钮 */
.btn-deliver {
  font-family: var(--font-serif); font-size: 16px;
  padding: 12px 40px; border: none; border-radius: var(--radius);
  background: var(--accent); color: #fff; cursor: pointer;
  transition: opacity 0.2s, transform 0.15s;
}
.btn-deliver:hover { opacity: 0.85; transform: scale(1.02); }
.btn-deliver:active { transform: scale(0.98); }
.btn-deliver:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

/* 通用按钮微交互 */
.btn-primary {
  font-family: var(--font-serif); font-size: 15px;
  padding: 12px 32px; border: none; border-radius: var(--radius);
  background: var(--accent); color: #fff; cursor: pointer;
  transition: opacity 0.2s, transform 0.15s;
}
.btn-primary:hover { opacity: 0.85; transform: scale(1.02); }
.btn-primary:active { transform: scale(0.98); }
.btn-ghost {
  font-size: 14px; padding: 10px 24px; border: 1px solid var(--border);
  border-radius: var(--radius); background: transparent;
  color: var(--text); cursor: pointer; font-family: var(--font-sans);
  transition: border-color 0.15s, background 0.15s;
}
.btn-ghost:hover { border-color: var(--text-subtle); background: var(--accent-ghost); }

/* ===== 等待界面 ===== */

  padding-top: 80px; text-align: center;
}
.waiting-wave {
  width: 120px; height: 60px; margin-bottom: 32px;

  display: flex; align-items: flex-end; justify-content: center; gap: 4px;
}
.wave-bar {
  width: 6px; background: var(--accent); border-radius: 3px;
  animation: wave 1.2s ease-in-out infinite;
}
.wave-bar:nth-child(1) { height: 20px; animation-delay: 0s; }
.wave-bar:nth-child(2) { height: 36px; animation-delay: 0.15s; }
.wave-bar:nth-child(3) { height: 28px; animation-delay: 0.3s; }
.wave-bar:nth-child(4) { height: 44px; animation-delay: 0.45s; }
.wave-bar:nth-child(5) { height: 24px; animation-delay: 0.6s; }
@keyframes wave { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(0.4); } }

.waiting-text { font-family: var(--font-serif); font-size: 16px; color: var(--text); }
.waiting-sub { font-size: 13px; color: var(--text-subtle); margin-top: 8px; }

/* ===== 匹配成功页 ===== */
.match-result { padding-top: 40px; max-width: 480px; margin: 0 auto; }
.resonance-block {
  font-family: var(--font-serif); font-size: 18px; line-height: 2;
  color: var(--text); margin-bottom: 32px; text-align: center;
  animation: fadeInUp 0.6s ease-out;
}
@keyframes fadeInUp {

}
.other-text-block {
  border-left: 2px solid var(--border); padding-left: 16px;

}
.other-text-label { font-size: 13px; color: var(--text-whisper); margin-bottom: 8px; }
.other-text-content {

}
.email-block {

}
.email-label { font-size: 13px; color: var(--text-whisper); margin-bottom: 6px; }
.email-address {

}
.icebreakers { margin-bottom: 32px; }
.icebreaker-item {
  font-size: 14px; color: var(--text-subtle); line-height: 1.8;

}
.icebreaker-item:nth-child(1) { animation-delay: 0.15s; }

.icebreaker-item:hover { color: var(--text); }
.icebreaker-label { font-size: 13px; color: var(--text-whisper); margin-bottom: 8px; }

.actions-row { display: flex; gap: 12px; justify-content: center; }
.btn-email {
  font-family: var(--font-serif); font-size: 15px;
  padding: 12px 32px; border-radius: var(--radius);
  background: var(--accent); color: #fff; text-decoration: none; cursor: pointer;
  border: none; display: inline-block;
}
.btn-email:hover { opacity: 0.85; }
.btn-secondary {

/* ===== 无匹配等待页 ===== */
.no-match {

}
.no-match-main {

}
.no-match-sub { font-size: 14px; color: var(--text-subtle); margin-bottom: 32px; }
.echo-snippet {

  padding: 16px 20px; border: 1px dashed var(--border-faint);

/* ===== AI 采访模式 ===== */
.interview-container { padding-top: 40px; max-width: 480px; margin: 0 auto; }

}

/* ===== 回访用户首页 ===== */
.returning-home { padding-top: 40px; max-width: 480px; margin: 0 auto; }

  text-align: center; line-height: 1.8;
}
.text-history-item {

}
.text-history-date { font-size: 12px; color: var(--text-whisper); }
.text-history-topic { font-size: 14px; color: var(--text); }
.text-history-status {

}
.status-pending { background: #ddf4e8; color: #1a7f4b; }
.status-matched { background: #e8e0f0; color: #6b4d8a; }
.status-expired { background: #fce4e4; color: #c42e2e; }

/* ===== 加载/进度 ===== */
.model-loading { text-align: center; padding-top: 80px; }
.progress-bar {
  width: 200px; height: 3px; background: var(--border-faint);
  border-radius: 2px; margin: 16px auto; overflow: hidden;
}
.progress-fill {
  height: 100%; background: var(--accent); border-radius: 2px;
  transition: width 0.3s;
}

/* ===== 遮罩 (微信/QQ引导) ===== */
.browser-guide-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65);
  display: flex; align-items: center; justify-content: center;

}
.browser-guide-box {
  background: var(--bg-card); padding: 32px 28px; border-radius: var(--radius);
  text-align: center; max-width: 320px; font-size: 14px; line-height: 1.8;
}
.browser-guide-box .arrow-icon { font-size: 32px; margin-bottom: 12px; }

/* ===== 底部 ===== */
.footer {
  max-width: var(--max-width); margin: 80px auto 0; padding: 24px 0;
  border-top: 1px solid var(--border-faint); text-align: center;
  font-size: 11px; color: var(--text-whisper); line-height: 2;
}
.footer a { color: var(--text-subtle); }
.footer-resources { margin-top: 8px; color: var(--text-whisper); }

/* ===== 移动端适配 ===== */
@media (max-width: 414px) {
  .page { padding: 24px 16px 60px; }
  .landing { padding-top: 40px; }
  .landing-title { font-size: 17px; }
  .resonance-block { font-size: 16px; }
  .email-address { font-size: 15px; }

/* --- 邮箱输入弹窗 --- */
.email-modal-overlay {
  position: fixed; inset: 0; z-index: 1000;

  align-items: center; justify-content: center;
  backdrop-filter: blur(2px);
}
.email-modal {
  background: #fff; border-radius: 16px; padding: 32px 28px;
  max-width: 380px; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,0.12);

}
.email-modal h3 {
  font-family: var(--font-serif); font-size: 20px;

}
.email-privacy-note {

}
.email-privacy-note a { color: var(--accent); text-decoration: none; }
.email-input {

.email-input:focus { border-color: var(--accent); }
.email-buttons { margin-top: 16px; display: flex; gap: 12px; justify-content: center; }
.btn-secondary { background: var(--bg-page); color: var(--text-whisper); border: 1px solid var(--border); padding: 10px 20px; border-radius: 10px; cursor: pointer; font-size: 14px; }

.shake { animation: shake 0.3s ease-in-out; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 50%{transform:translateX(6px)} 75%{transform:translateX(-4px)} }

<!-- ===== 模块脚本 ===== -->
<script type="module">
  /**
   * fata 主应用 — index.html
   * 加载顺序: config → modules → UI 初始化
   */

  import { ModelLoader } from './modules/model-loader.js';
  import { SafetyHandler } from './modules/safety-handler.js';
  import { LLMFallback } from './modules/llm-fallback.js';
  import { LowSignalGuide } from './modules/low-signal-guide.js';
  import { ResendRetry } from './modules/resend-retry.js';
  import { MatchEngine } from './modules/match-engine.js';

  // ===== 全局状态 =====
  const state = {
    userEmail: null,           // 用户邮箱
    currentText: null,         // 当前编辑的文字
    intentProfile: null,       // LLM 意图解析结果
    matchMode: 'deep',         // 'deep' | 'fast'
    showTextToMatch: true,     // 是否允许展示文字给对方
    isReturningUser: false,    // 是否为回访用户
    modelStatus: 'idle',       // 'idle' | 'loading' | 'ready' | 'fallback'
    pendingTexts: [],          // 历史文字列表
    currentMatch: null,        // 当前匹配结果
    draft: null               // 草稿
  };

  // HMAC 密钥（浏览器端生成，与服务端 HMAC_KEY 相同）
  let HMAC_KEY_RAW = '';
  window.HMAC_KEY_RAW = undefined; // 暴露给 MatchEngine 模块访问，首次 HMAC 获取后更新

  // 监听网络恢复后模型重新加载（来自 ModelLoader）
  window.addEventListener('fata:model-ready', (e) => {
    if (e.detail && e.detail.pipeline) {
      MatchEngine.pipeline = e.detail.pipeline;
      state.modelStatus = 'ready';
    }
  });

  // ===== 初始化 =====
  async function init() {
    // 检测浏览器环境
    if (isWeChatOrQQ()) {
      showBrowserGuide();
    }

    // 检查草稿
    state.draft = LowSignalGuide.loadDraft();

    // 检查是否为回访用户
    const history = await loadFromIndexedDB('fata_history');
    if (history && history.length > 0) {
      state.isReturningUser = true;
      state.pendingTexts = history;
    }

    // 加载模型
    renderModelLoading();
    const result = await ModelLoader.initialize(onModelProgress);

    // 从 Worker 获取 HMAC 密钥（存入 sessionStorage，仅本次会话有效）
    try {
      const keyResp = await fetch('https://worker.fata.uk/api/health');
      if (keyResp.ok) {
        HMAC_KEY_RAW = sessionStorage.getItem('fata_hmac_key') ||
          await _fetchHMACKey();
      }
    } catch (e) {
      console.warn('fata: HMAC key fetch failed, API calls will be unsigned');
    }

    if (result.mode === 'full') {
      state.modelStatus = 'ready';
      await MatchEngine.initialize(result);
    } else {
      state.modelStatus = 'fallback';
      // 在降级模式下初始化（使用 TF-IDF）
      // 不加载 Transformers.js pipeline，走字符 bigram + 余弦相似度降级
      await MatchEngine.initialize({ mode: 'fallback' });
    }

    // 渲染首页
    renderHome();
  }

  function onModelProgress(pct, text) {
    document.querySelector('.progress-fill').style.width = pct + '%';
    document.querySelector('.progress-text').textContent = text;
  }

  // ===== 页面渲染 =====

  function renderModelLoading() {
    document.getElementById('app').innerHTML = `
      <div class="model-loading">
        <p class="waiting-text">正在准备文字引擎...</p>
        <div class="progress-bar"><div class="progress-fill" style="width:0%"></div></div>
        <p class="waiting-sub progress-text"></p>
      </div>
    `;
  }

  function renderHome() {
    const app = document.getElementById('app');
    document.getElementById('page-footer').style.display = 'block';

    if (state.isReturningUser) {
      renderReturningHome(app);
    } else {
      renderLanding(app);
    }
  }

  function renderLanding(app) {
    app.innerHTML = `
      <div class="landing">
        <h1 class="landing-title">写一段话，找到文字频率最接近的陌生人</h1>

        <div class="landing-editor">
          <textarea id="user-text" placeholder="今天在想什么？"></textarea>
        </div>

        <div class="length-hint" id="length-hint"></div>

        <div class="writing-prompts" id="writing-prompts">
          <button class="writing-prompt" data-text="今天发生了一件让我...">今天发生了一件让我...</button>
          <button class="writing-prompt" data-text="最近一直在想一个问题...">最近一直在想一个问题...</button>
          <button class="writing-prompt" data-text="如果有一个人能理解我...">如果有一个人能理解我...</button>
          <button class="writing-prompt" data-text="随便写点什么，不急">随便写点什么，不急</button>
        </div>

        <div class="snippet-scroll" id="snippet-scroll"></div>

        <div class="privacy-options">
          <label>
            <input type="checkbox" id="show-text-check" checked>
            匹配成功后向对方展示我的文字片段

  async function handleDeliver() {
    const textarea = document.getElementById('user-text');
    const text = textarea.value.trim();

    if (!text) return;

    // 获取或提示输入邮箱
    const email = await getOrAskEmail();
    if (!email) return;

    // Step 1: 信号密度评分 + 安全检测
    const signalResult = await LLMFallback.callWithTimeout('/api/llm/analyze', {
      prompt_type: 'signal_density',
      text_a: text
    }, HMAC_KEY_RAW);

    // Step 2: 安全检测
    if (signalResult) {
      const safetyDecision = SafetyHandler.handleAnalysis(signalResult, text);

      if (!safetyDecision.shouldCreateIssue) {
        if (safetyDecision.uiState === 'support_resources') {
          showSupportResources(safetyDecision.resources);
        } else if (safetyDecision.uiState === 'rejected') {
          showRejection(safetyDecision);
        }
        return;
      }
    } else {
      // LLM 不可用时，用本地关键词检查做兜底
      const localCheck = SafetyHandler.localCheck(text);
      if (localCheck.action === 'support') {
        showSupportResources(SafetyHandler.resources);
        return;
      }
      if (localCheck.action === 'reject') {
        showRejection({ cooldownMinutes: 60 });
        return;
      }
    }

    // Step 3: 试探型用户引导
    if (signalResult && signalResult.score) {
      const guideDecision = LowSignalGuide.checkNeedsGuide(text, signalResult);
      if (guideDecision.needsGuide) {
        showLowSignalGuide(text);
        return;
      }
    }

    // Step 4: 执行匹配
    await executeMatch(text, email, signalResult);
  }

  // ===== 匹配流程 =====

  async function executeMatch(text, email, signalResult) {
    showWaiting('正在感受你的文字...');

    // 意图解析（深度匹配模式）
    let intentProfile = null;
    if (state.matchMode === 'deep') {
      const intentResult = await LLMFallback.callWithTimeout('/api/llm/analyze', {
        prompt_type: 'intent_parse',
        text_a: text
      }, HMAC_KEY_RAW);
      if (intentResult) {
        intentProfile = intentResult;
      }
    }

    showWaiting('正在将你的频率和池子里的文字进行对比...');

    // 匹配
    const matchResult = await MatchEngine.findMatch(
      text,
      await encryptEmail(email),
      intentProfile,
      state.matchMode
    );

    if (matchResult.matched) {
      // 生成共鸣描述
      const resonance = await generateResonance(text, matchResult.matchInfo.otherText);
      // 保存匹配历史
      await saveToIndexedDB('fata_history', {
        id: Date.now(),
        text: text,
        snippet: text.slice(0, 80),
        status: 'matched',
        timestamp: Date.now(),
        matchEmail: matchResult.matchInfo.otherEmail
      });
      state.pendingTexts.push({
        id: Date.now().toString(),
        text: text,
        snippet: text.slice(0, 80),
        status: 'matched',
        timestamp: Date.now()
      });
      showMatchSuccess(matchResult, resonance, text);

      // 异步发送双方通知邮件（不阻塞 UI）
      const emailHashB = await sha256(matchResult.matchInfo.otherEmail || '');
      ResendRetry.sendWithRetry({
        matchA: {
          email,
          ownTextSnippet: text.slice(0, 120),
          showOwnText: state.showTextToMatch,
          seeOtherText: matchResult.matchInfo.otherText ? true : false,
          textSnippet: matchResult.matchInfo.otherText
            ? matchResult.matchInfo.otherText.slice(0, 120) : ''
        },
        matchB: {
          email: matchResult.matchInfo.otherEmail,
          ownTextSnippet: matchResult.matchInfo.otherText
            ? matchResult.matchInfo.otherText.slice(0, 120) : '',
          showOwnText: true,
          seeOtherText: state.showTextToMatch,
          textSnippet: state.showTextToMatch ? text.slice(0, 120) : '',
          emailHash: emailHashB
        },
        resonance: resonance.resonance,
        icebreakers: resonance.questions
      }, matchResult.matchIssueNumber).catch(e => {
        console.warn('fata: Resend notification failed', e);
      });
    } else {
      await saveToIndexedDB('fata_history', {
        id: Date.now(),
        text: text,
        snippet: text.slice(0, 80),
        status: 'pending',
        timestamp: Date.now()
      });
      state.pendingTexts.push({
        id: Date.now().toString(),
        text: text,
        snippet: text.slice(0, 80),
        status: 'pending',
        timestamp: Date.now()
      });
      showNoMatch(matchResult);
    }
  }

  async function encryptEmail(email) {
    // 使用 AES-256-GCM 加密，密钥从 HMAC_KEY_RAW 派生（与 decrypt 端对齐）
    // 加密后的格式：base64(iv + ciphertext)
    try {
      const encoder = new TextEncoder();
      const keyData = encoder.encode(HMAC_KEY_RAW).slice(0, 32); // 256-bit
      const key = await crypto.subtle.importKey('raw', keyData,
        { name: 'AES-GCM' }, false, ['encrypt']);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ciphertext = await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv },
        key,
        encoder.encode(email)
      );
      // 拼接 IV + ciphertext
      const combined = new Uint8Array(iv.length + ciphertext.byteLength);
      combined.set(iv);
      combined.set(new Uint8Array(ciphertext), iv.length);
      return btoa(String.fromCharCode(...combined));
    } catch (e) {
      console.error('fata: encryptEmail failed', e);
      throw e;
    }
  }

  async function _fetchHMACKey() {
    // 从 Worker 获取 HMAC 密钥（仅一次，存入 sessionStorage）
    try {
      const path = '/api/hmac-key';
      const ts = Math.floor(Date.now() / 1000).toString();
      // 初次请求没有 HMAC 签名（鸡生蛋问题），Worker 的 /api/hmac-key 豁免 HMAC
      const resp = await fetch(`https://worker.fata.uk${path}`, {
        headers: { 'X-Fata-Timestamp': ts }
      });
      if (resp.ok) {
        const data = await resp.json();
        if (data.hmac_key) {
          sessionStorage.setItem('fata_hmac_key', data.hmac_key);
          return data.hmac_key;
        }
      }
    } catch (e) {
      console.warn('fata: could not fetch HMAC key', e);
    }
    return '';
  }

  async function loadWritingSnippets() {
    const container = document.getElementById('snippet-scroll');
    if (!container) return;

    // 尝试从种子 Issue 加载（带 IndexedDB 24h 缓存）
    try {
      const cached = await loadSnippetCache();
      if (cached && cached.snippets && cached.snippets.length > 0) {
        renderSnippets(cached.snippets);
        return;
      }

      const resp = await fetch('/api/github/issues?labels=seed&per_page=5&state=open');
      if (resp.ok) {
        const issues = await resp.json();
        const snippets = issues
          .map(i => (i.body && i.body.text_snippet) ? i.body.text_snippet : null)
          .filter(Boolean)
          .slice(0, 5);
        if (snippets.length > 0) {
          await saveSnippetCache(snippets);
          renderSnippets(snippets);
          return;
        }
      }
    } catch (e) {
      // API 不可用时用硬编码默认值（保持界面不空）
    }

    const defaults = [
      '今天下班看到一只猫在雨里躲，想给它撑伞但...',
      '失眠第三天。开始怀疑是不是床的问题而不是我的问题。',
      '很久没联系的朋友突然发了条消息。我没回。不知道回什么。'
    ];
    renderSnippets(defaults);
  }

  function renderSnippets(snippets) {
    const container = document.getElementById('snippet-scroll');
    if (!container) return;
    container.innerHTML = `
      <div class="snippet-label">最近有人在写——</div>
      ${snippets.map(s => `<div class="snippet-item">"${escapeHTML(s)}"</div>`).join('')}
    `;
  }

  async function loadSnippetCache() {
    try {
      const raw = localStorage.getItem('fata_snippet_cache');
      if (!raw) return null;
      const cached = JSON.parse(raw);
      if (Date.now() - cached.ts < 86400000) return cached; // 24h
    } catch (e) { /* ignore */ }
    return null;
  }

  async function saveSnippetCache(snippets) {
    try {
      localStorage.setItem('fata_snippet_cache', JSON.stringify({
        snippets,
        ts: Date.now()
      }));
    } catch (e) { /* ignore */ }
  }

  function getEchoSnippet() {
    // 尝试从缓存的种子片段中选一条
    try {
      const raw = localStorage.getItem('fata_snippet_cache');
      if (raw) {
        const cached = JSON.parse(raw);
        if (cached.snippets && cached.snippets.length > 0) {
          return cached.snippets[Math.floor(Math.random() * cached.snippets.length)];
        }
      }
    } catch (e) { /* ignore */ }
    return '最近在学吉他。手指磨破了但很开心。不知道为什么突然想做一件没有用的事。';
  }

  function getNextInterviewQuestion(userText, round) {
    const questions = [
      '这种感觉是从什么时候开始的？',
      '有没有哪一刻让你觉得特别明显？',
      '如果有一个平行世界的你做了不同的选择，你觉得那个你会对现在的你说什么？',
      '最后一个问题——如果有一个人，听完你说的这些话，什么都不说，只是点点头——你觉得怎么样？'
    ];
    return questions[Math.min(round - 2, questions.length - 1)];
  }

  function formatDate(ts) {
    const d = new Date(ts);
    return `${d.getMonth() + 1}月${d.getDate()}日`;
  }

  function statusLabel(status) {
    return { pending: '等待中', matched: '已匹配', expired: '已过期' }[status] || status;
  }

  async function sha256(message) {
    const encoder = new TextEncoder();
    const data = encoder.encode(message);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }

  async function loadFromIndexedDB(storeName) {
    try {
      return new Promise((resolve) => {
        const DB_NAME = 'fata_user_data';
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains(storeName)) {
            db.createObjectStore(storeName, { keyPath: 'id', autoIncrement: true });
          }
        };
        request.onsuccess = () => {
          const db = request.result;
          const tx = db.transaction(storeName, 'readonly');
          const store = tx.objectStore(storeName);
          const getAll = store.getAll();
          getAll.onsuccess = () => resolve(getAll.result || []);
          getAll.onerror = () => resolve([]);
        };
        request.onerror = () => resolve([]);
      });
    } catch (e) {
      console.warn('fata: loadFromIndexedDB failed', e);
      return [];
    }
  }

  async function saveToIndexedDB(storeName, entry) {
    try {
      const DB_NAME = 'fata_user_data';
      return new Promise((resolve) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains(storeName)) {
            db.createObjectStore(storeName, { keyPath: 'id', autoIncrement: true });
          }
        };
        request.onsuccess = () => {
          const db = request.result;
          const tx = db.transaction(storeName, 'readwrite');
          const store = tx.objectStore(storeName);
          store.put(entry);
          tx.oncomplete = () => resolve();
          request.onerror = () => resolve();
        };
        request.onerror = () => resolve();
      });
    } catch (e) {
      console.warn('fata: saveToIndexedDB failed', e);
    }
  }

  // ===== 暴露 API =====
  window.fata = {
    renderHome,
    showWritePage: () => renderHome(),
    showHistory: () => { state.isReturningUser = true; renderHome(); },
    expandEditor: (text) => {
      if (typeof text === 'string' && text) {
        setTimeout(() => {
          const ta = document.getElementById('user-text');
          if (ta) ta.value = text;
        }, 0);
      }
      renderHome();
    },
    forceSubmit: () => handleDeliver(),
    saveAsDraft: (text) => {
      const txt = typeof text === 'string' && text
        ? text
        : (document.getElementById('user-text')?.value || '');
      LowSignalGuide.saveDraft(txt);
    },
    switchMatchMode: (mode) => { state.matchMode = mode; renderHome(); },
    submit: handleDeliver,
    ui: {
      showWritePage: () => renderHome(),
      showHistory: () => { state.isReturningUser = true; renderHome(); },
      expandEditor: (text) => {
        if (typeof text === 'string' && text) {
          setTimeout(() => {
            const ta = document.getElementById('user-text');
            if (ta) ta.value = text;
          }, 0);
        }
        renderHome();
      },
      forceSubmit: () => handleDeliver(),
      saveAsDraft: () => {
        const txt = document.getElementById('user-text')?.value || '';
        LowSignalGuide.saveDraft(txt);
      }
    }
  };

  // ===== 启动 =====
  init().catch(err => {
    console.error('fata init error:', err);
    document.getElementById('app').innerHTML = `
      <div style="text-align:center;padding-top:80px;">
        <p>fata 正在准备中……如果长时间没有响应，请刷新页面。</p>
      </div>
    `;
  });
</script>
