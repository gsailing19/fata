<style>
/* ===== fata · Apple-style Design System ===== */
:root {
  --bg: #f5f5f7;
  --bg-card: #fff;
  --text: #1d1d1f;
  --text-subtle: #86868b;
  --text-whisper: #aeaeb2;
  --border: #d2d2d7;
  --border-faint: #e8e8ed;
  --accent: #1d1d1f;
  --accent-ghost: rgba(0,0,0,0.04);
  --warm: #c47a4a;
  --warm-ghost: rgba(196,122,74,0.06);
  --warm-glow: rgba(196,122,74,0.15);
  --wave-line: rgba(0,0,0,0.05);
  --font-serif: Georgia, 'Noto Serif SC', 'Noto Serif', serif;
  --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
  --font-mono: 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace;
  --radius-sm: 8px;
  --radius: 14px;
  --radius-lg: 20px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-card: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
  --shadow-float: 0 4px 16px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
  --spring: cubic-bezier(0.16, 1, 0.3, 1);
  --max-width: 540px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 17px;
  line-height: 1.47059;
  letter-spacing: -0.022em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ===== 布局 ===== */
.page {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 60px 24px 100px;
  min-height: 100vh;
}

/* ===== 首页 ===== */
.landing {
  display: flex; flex-direction: column; align-items: center;
  padding-top: 40px; text-align: center;
}
.landing-title {
  font-family: var(--font-serif);
  font-size: 28px; font-weight: 400; color: var(--text);
  margin-bottom: 12px; line-height: 1.3;
  letter-spacing: -0.015em; text-wrap: balance;
}
.landing-logo { margin-bottom: 16px; opacity: 0.85; }
.landing-logo svg { display: block; }
.landing-wave-line {
  display: block; width: 120px; height: 24px;
  margin: 0 auto 28px; opacity: 0.45;
}
.landing-wave-line svg { display: block; }
.landing-editor {
  width: 100%; max-width: 480px; margin-bottom: 20px;
}
.landing-editor textarea {
  width: 100%; min-height: 180px; padding: 24px;
  font-family: var(--font-serif); font-size: 16px; line-height: 1.8;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg-card); color: var(--text);
  resize: vertical; outline: none;
  box-shadow: var(--shadow-sm);
  transition: border-color 0.25s var(--spring), box-shadow 0.25s var(--spring);
}
.landing-editor textarea::placeholder {
  color: var(--text-whisper); font-style: italic;
}
.landing-editor textarea:focus {
  border-color: var(--warm);
  box-shadow: 0 0 0 4px rgba(196,122,74,0.1), var(--shadow-sm);
  outline: none;
}

/* 起笔提示 */
.writing-prompts {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
  margin-bottom: 16px; max-width: 480px;
}
.writing-prompt {
  font-size: 13px; color: var(--text-subtle); padding: 7px 16px;
  border: 1px solid var(--border); border-radius: 20px;
  cursor: pointer; background: rgba(255,255,255,0.6); font-family: var(--font-sans);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: all 0.25s var(--spring);
}
.writing-prompt:hover {
  border-color: var(--warm); color: var(--warm);
  background: rgba(255,255,255,0.9); transform: translateY(-1px);
  box-shadow: var(--shadow-card);
}

/* 采访入口 - 更醒目的位置 */
.interview-prompt {
  margin-bottom: 24px; text-align: center;
}
.interview-prompt a {
  font-size: 14px; color: var(--warm); text-decoration: none;
  border-bottom: 1px solid rgba(196,122,74,0.3);
  padding-bottom: 2px; transition: all 0.2s;
}
.interview-prompt a:hover { border-bottom-color: var(--warm); opacity: 0.8; }



/* 隐私选择行 */
.privacy-options {
  display: flex; gap: 28px; justify-content: center; margin-bottom: 20px;
  font-size: 13px; color: var(--text-subtle);
}
.privacy-options label { cursor: pointer; display: flex; align-items: center; gap: 6px; }
.privacy-options input[type=checkbox] {
  appearance: none;
  -webkit-appearance: none;
  width: 20px; height: 20px;
  border: 1.5px solid var(--border);
  border-radius: 5px;
  background: var(--bg-card);
  cursor: pointer;
  position: relative;
  flex-shrink: 0;
  transition: all 0.25s var(--spring);
  margin: 0;
}
.privacy-options input[type=checkbox]:checked {
  background: var(--warm);
  border-color: var(--warm);
}
.privacy-options input[type=checkbox]::after {
  content: '';
  position: absolute;
  left: 5.5px; top: 2px;
  width: 6px; height: 10px;
  border: solid #fff;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg) scale(0);
  transition: transform 0.2s var(--spring);
  opacity: 0;
}
.privacy-options input[type=checkbox]:checked::after {
  transform: rotate(45deg) scale(1);
  opacity: 1;
}
.privacy-options input[type=checkbox]:hover {
  border-color: var(--warm);
}
.privacy-options input[type=checkbox]:active {
  transform: scale(0.92);
}



/* 投递按钮 */
.btn-deliver {
  font-family: var(--font-sans); font-size: 16px; font-weight: 500;
  padding: 14px 48px; border: none; border-radius: 28px;
  background: var(--warm); color: #fff; cursor: pointer;
  transition: all 0.3s var(--spring);
  box-shadow: 0 2px 8px rgba(196,122,74,0.2);
  letter-spacing: -0.01em;
}
.btn-deliver:hover {
  transform: scale(1.03);
  box-shadow: 0 8px 24px rgba(196,122,74,0.3);
}
.btn-deliver:active { transform: scale(0.97); }
.btn-deliver:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }

.about-link {
  display: inline-block; margin-top: 18px; font-size: 15px;
  color: var(--warm); text-decoration: none;
  transition: opacity 0.2s; font-family: var(--font-sans);
}
.about-link::after {
  content: ' →'; font-size: 13px; opacity: 0.6;
}
.about-link:hover { opacity: 0.7; }

/* 通用按钮微交互 */
.btn-primary {
  font-family: var(--font-sans); font-size: 15px; font-weight: 500;
  padding: 13px 32px; border: none; border-radius: 24px;
  background: var(--warm); color: #fff; cursor: pointer;
  transition: all 0.3s var(--spring);
  box-shadow: 0 2px 8px rgba(196,122,74,0.2);
}
.btn-primary:hover { transform: scale(1.03); box-shadow: 0 8px 24px rgba(196,122,74,0.3); }
.btn-primary:active { transform: scale(0.97); }
.btn-ghost {
  font-size: 14px; padding: 11px 24px; border: 1px solid var(--border);
  border-radius: 24px; background: rgba(255,255,255,0.5);
  color: var(--text); cursor: pointer; font-family: var(--font-sans);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: all 0.25s var(--spring);
}
.btn-ghost:hover {
  border-color: var(--text-subtle);
  background: rgba(255,255,255,0.8);
  transform: translateY(-1px);
  box-shadow: var(--shadow-card);
}

/* 语言切换 - 右上角 */
.lang-switch-top {
  position: fixed; top: 24px; right: 24px; z-index: 100;
}
.lang-switch-top a {
  font-size: 13px; color: var(--text-subtle); text-decoration: none;
  padding: 6px 14px; border-radius: 20px;
  background: rgba(255,255,255,0.6); backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--border);
  transition: all 0.2s;
}
.lang-switch-top a:hover { color: var(--warm); border-color: var(--warm); }

/* ===== 等待界面 ===== */
.waiting-container {
  display: flex; flex-direction: column; align-items: center;
  padding-top: 120px; text-align: center;
}
.waiting-wave {
  width: 120px; height: 60px; margin-bottom: 40px;
  display: flex; align-items: flex-end; justify-content: center; gap: 5px;
}
.wave-bar {
  width: 5px; background: var(--warm); border-radius: 3px;
  animation: wave 1.2s ease-in-out infinite;
}
.wave-bar:nth-child(1) { height: 20px; animation-delay: 0s; }
.wave-bar:nth-child(2) { height: 36px; animation-delay: 0.15s; }
.wave-bar:nth-child(3) { height: 28px; animation-delay: 0.3s; }
.wave-bar:nth-child(4) { height: 44px; animation-delay: 0.45s; }
.wave-bar:nth-child(5) { height: 24px; animation-delay: 0.6s; }
@keyframes wave { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(0.4); } }

.waiting-text {
  font-family: var(--font-serif); font-size: 18px; color: var(--text);
  letter-spacing: -0.01em;
}
.waiting-sub { font-size: 14px; color: var(--text-subtle); margin-top: 10px; }

/* ===== 匹配成功页 ===== */
.match-result { padding-top: 60px; max-width: 480px; margin: 0 auto; }
.resonance-block {
  font-family: var(--font-serif); font-size: 20px; line-height: 1.8;
  color: var(--text); margin-bottom: 36px; text-align: center;
  letter-spacing: -0.01em; text-wrap: balance;
  animation: fadeInUp 0.7s var(--spring);
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 共振环动画 */
.resonance-rings {
  width: 140px; height: 140px;
  margin: 0 auto 32px;
  position: relative;
}
.resonance-rings svg { display: block; width: 100%; height: 100%; }

/* 波形分隔线 */
.wave-sep {
  width: 80px; height: 16px;
  margin: 28px auto;
  opacity: 0.35;
}
.wave-sep svg { display: block; }

.other-text-block {
  position: relative;
  padding: 20px 24px 20px 48px;
  margin-bottom: 28px;
  background: var(--warm-ghost);
  border-radius: var(--radius);
  border-left: 3px solid rgba(196,122,74,0.35);
  animation: fadeInUp 0.6s var(--spring) 0.2s both;
}
.other-text-block::before {
  content: '\201C';
  position: absolute;
  left: 16px; top: 10px;
  font-family: var(--font-serif); font-size: 42px;
  color: rgba(196,122,74,0.2);
  line-height: 1;
  pointer-events: none;
}
.other-text-label { font-size: 13px; color: var(--text-whisper); margin-bottom: 8px; font-family: var(--font-sans); }
.other-text-content {
  font-family: var(--font-serif); font-size: 15px; font-style: italic;
  color: var(--text); line-height: 1.9;
}

.email-block {
  background: var(--warm-ghost); padding: 24px 28px; border-radius: var(--radius-lg);
  margin-bottom: 28px; text-align: center;
  border: 1px solid rgba(196,122,74,0.1);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.email-label { font-size: 13px; color: var(--text-whisper); margin-bottom: 8px; }
.email-address {
  font-size: 20px; font-weight: 600; color: var(--text);
  font-family: var(--font-mono); letter-spacing: -0.01em;
  word-break: break-all;
}

.icebreakers { margin-bottom: 36px; }
.icebreaker-item {
  font-size: 15px; color: var(--text-subtle); line-height: 2;
  padding: 10px 0; cursor: pointer;
  transition: color 0.2s, transform 0.2s var(--spring);
  animation: fadeInUp 0.5s var(--spring) both;
}
.icebreaker-item:nth-child(1) { animation-delay: 0.15s; }
.icebreaker-item:nth-child(2) { animation-delay: 0.3s; }
.icebreaker-item:nth-child(3) { animation-delay: 0.45s; }
.icebreaker-item:hover { color: var(--text); transform: translateX(4px); }
.icebreaker-label { font-size: 13px; color: var(--text-whisper); margin-bottom: 10px; }

.actions-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.btn-email {
  font-family: var(--font-sans); font-size: 15px; font-weight: 500;
  padding: 13px 32px; border-radius: 24px;
  background: var(--warm); color: #fff; text-decoration: none; cursor: pointer;
  border: none; display: inline-block;
  box-shadow: 0 2px 8px rgba(196,122,74,0.2);
  transition: all 0.3s var(--spring);
}
.btn-email:hover { transform: scale(1.03); box-shadow: 0 8px 24px rgba(196,122,74,0.3); }
.btn-secondary {
  font-size: 14px; padding: 12px 24px; border-radius: 24px;
  border: 1px solid var(--border); background: rgba(255,255,255,0.5);
  color: var(--text); cursor: pointer; font-family: var(--font-sans);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: all 0.25s var(--spring);
}
.btn-secondary:hover {
  border-color: var(--text-subtle);
  background: rgba(255,255,255,0.8);
  transform: translateY(-1px);
}

/* 匹配成功 — 分享模块 */
.match-share-hint {
  margin-top: 40px;
  padding: 20px 16px 16px;
  border-top: 1px solid var(--border);
  text-align: center;
  animation: fadeInUp 0.6s var(--spring) 0.5s both;
}
.match-share-toggle {
  display: none; /* 不再需要 toggle，内容直接展示 */
}
.match-share-content {
  /* 默认展开，不再折叠 */
}
.match-share-text {
  font-family: var(--font-serif);
  font-size: 14px;
  color: var(--text-subtle);
  line-height: 1.8;
  margin-bottom: 8px;
  text-wrap: balance;
}
.match-share-url {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--text-whisper);
  margin-bottom: 14px;
}
.match-share-copy-btn {
  display: inline-block;
  font-size: 13px;
  padding: 6px 20px;
  border-radius: 16px;
  border: 1px solid var(--border);
  color: var(--text-subtle);
  cursor: pointer;
  font-family: var(--font-sans);
  background: rgba(255,255,255,0.3);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  transition: all 0.25s var(--spring);
}
.match-share-copy-btn:hover {
  border-color: var(--text-subtle);
  background: rgba(255,255,255,0.7);
  color: var(--text);
}

/* ===== 无匹配等待页 ===== */
.no-match {
  display: flex; flex-direction: column; align-items: center;
  padding-top: 100px; text-align: center;
}
.no-match-main {
  font-family: var(--font-serif); font-size: 20px; margin-bottom: 16px;
  letter-spacing: -0.01em;
}
.no-match-sub { font-size: 15px; color: var(--text-subtle); margin-bottom: 36px; }
.echo-snippet {
  font-family: var(--font-serif); font-size: 15px; font-style: italic;
  color: var(--text-subtle); max-width: 400px; line-height: 1.9;
  padding: 20px 24px; border: 1px dashed rgba(196,122,74,0.2);
  border-radius: var(--radius-lg); margin-bottom: 28px;
}

/* ===== AI 采访模式 ===== */
.interview-container { padding-top: 40px; max-width: 480px; margin: 0 auto; }
.interview-back { margin-bottom: 20px; }
.interview-back a {
  font-size: 14px; color: var(--text-subtle); text-decoration: none;
  transition: color 0.2s;
}
.interview-back a:hover { color: var(--warm); }
.interview-messages { margin-bottom: 28px; }
.interview-msg {
  font-size: 15px; line-height: 1.7; margin-bottom: 16px; padding: 14px 18px;
  border-radius: var(--radius); max-width: 85%;
  animation: fadeInUp 0.4s var(--spring) both;
}
.interview-msg.ai {
  background: rgba(0,0,0,0.03); color: var(--text);
  margin-right: auto; font-family: var(--font-serif);
  border-bottom-left-radius: 4px;
}
.interview-msg.user {
  background: var(--bg-card); color: var(--text);
  margin-left: auto; box-shadow: var(--shadow-sm);
  border-bottom-right-radius: 4px;
  text-align: right;
}
.interview-input-row { display: flex; gap: 8px; }
.interview-input {
  flex: 1; padding: 13px 18px; font-size: 15px;
  border: 1px solid var(--border); border-radius: 24px;
  background: var(--bg-card); font-family: var(--font-sans);
  box-shadow: var(--shadow-sm);
  transition: border-color 0.2s var(--spring), box-shadow 0.2s var(--spring);
}
.interview-input:focus {
  border-color: var(--warm);
  box-shadow: 0 0 0 4px rgba(196,122,74,0.1);
  outline: none;
}
.interview-send {
  padding: 10px 20px; font-size: 14px; border-radius: 24px;
  background: var(--warm); color: #fff; border: none; cursor: pointer;
  font-family: var(--font-sans); font-weight: 500;
  transition: all 0.3s var(--spring);
}
.interview-send:hover { transform: scale(1.05); }

/* ===== 回访用户首页 ===== */
.returning-home { padding-top: 60px; max-width: 480px; margin: 0 auto; }
.returning-summary {
  font-family: var(--font-serif); font-size: 17px; margin-bottom: 36px;
  text-align: center; line-height: 1.8;
}
.text-history-item {
  padding: 16px 18px; background: var(--bg-card);
  border-radius: var(--radius);
  margin-bottom: 8px;
  display: flex; justify-content: space-between; align-items: center;
  box-shadow: var(--shadow-sm);
  transition: transform 0.2s var(--spring), box-shadow 0.2s var(--spring);
}
.text-history-item:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-float);
}
.text-history-date { font-size: 12px; color: var(--text-whisper); }
.text-history-topic { font-size: 14px; color: var(--text); }
.text-history-status {
  font-size: 12px; padding: 3px 10px; border-radius: 12px; font-weight: 500;
}
.status-pending { background: #e8f5e9; color: #2e7d32; }
.status-matched { background: #f3e5f5; color: #7b1fa2; }
.status-expired { background: #fce4ec; color: #c62828; }

/* ===== 加载/进度 ===== */
.model-loading { text-align: center; padding-top: 120px; }
.progress-bar {
  width: 200px; height: 3px; background: var(--border-faint);
  border-radius: 2px; margin: 20px auto; overflow: hidden;
}
.progress-fill {
  height: 100%; background: var(--warm); border-radius: 2px;
  transition: width 0.4s var(--spring);
}

/* ===== 遮罩 (微信/QQ引导) ===== */
.browser-guide-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.browser-guide-box {
  background: rgba(255,255,255,0.92); padding: 36px 32px;
  border-radius: var(--radius-lg); text-align: center;
  max-width: 320px; font-size: 14px; line-height: 1.8;
  box-shadow: var(--shadow-float);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}
.browser-guide-box .arrow-icon { font-size: 36px; margin-bottom: 16px; }

/* ===== 底部 ===== */
.footer {
  max-width: var(--max-width); margin: 120px auto 0; padding: 32px 0 28px;
  border-top: 1px solid rgba(0,0,0,0.06); text-align: center;
  font-size: 12px; color: var(--text-whisper); line-height: 2;
  letter-spacing: 0.01em;
}
.footer a { color: var(--text-subtle); transition: color 0.2s; }
.footer a:hover { color: var(--warm); }
.footer-resources { margin-top: 10px; color: var(--text-whisper); }

/* ===== 移动端适配 ===== */
@media (max-width: 414px) {
  .page { padding: 40px 18px 80px; }
  .landing { padding-top: 30px; }
  .landing-logo { margin-bottom: 12px; }
  .landing-title { font-size: 22px; }
  .resonance-block { font-size: 17px; }
  .email-address { font-size: 16px; }

.btn-secondary { background: rgba(0,0,0,0.03); color: var(--text); border: 1px solid var(--border); padding: 12px 22px; border-radius: 24px; cursor: pointer; font-size: 14px; font-family: var(--font-sans); transition: all 0.25s var(--spring); }
.btn-primary { background: var(--warm); color: #fff; border: none; padding: 12px 28px; border-radius: 24px; cursor: pointer; font-size: 14px; font-weight: 500; font-family: var(--font-sans); box-shadow: 0 2px 8px rgba(196,122,74,0.2); transition: all 0.3s var(--spring); }
.email-tip { font-size: 13px; color: var(--text-whisper); margin-top: 16px; }

  async function handleDeliver() {
    const textarea = document.getElementById('user-text');
    const text = textarea.value.trim();
    if (!text) return;

    const email = await getOrAskEmail();
    if (!email) return;

    console.log('fata: phase1-start', { textLen: text.length, lang: currentLang });

    // Phase 1: Signal density + safety check (browser-side, instant)
    showWaiting(t('waiting.feeling'));
    const signalResult = SignalHeuristic.computeSignalDensity(text, currentLang);

    // Safety check
    const localCheck = SafetyHandler.localCheck(text);
    if (localCheck.action === 'support') {
      showSupportResources(SafetyHandler.resources);
      return;
    }
    if (localCheck.action === 'reject') {
      showRejection({ cooldownSeconds: 3600 });
      return;
    }

    // Low signal guide
    if (signalResult.score < 0.3) {
      const guideDecision = LowSignalGuide.checkNeedsGuide(text, signalResult);
      if (guideDecision.needsGuide) {
        showLowSignalGuide(text);
        return;
      }
    }

    console.log('fata: phase1-done', { score: signalResult.score });

    // Phase 2: Full submit (PoW → Worker handles embedding + matching)
    showWaiting(t('submit.sending'));

    // Save draft before submit (recovery on failure)
    sessionStorage.setItem('fata_draft_text', text);
    sessionStorage.setItem('fata_draft_email', email);

    // Probe API connectivity before PoW (caches working base URL)
    try { await APIClient.getBaseURL(); } catch (_) { /* will surface in PoW step */ }

    console.log('fata: pow-start', { base: APIClient._activeBase, hasToken: !!apiToken });

    try {
      // Run PoW challenge to get api token
      if (!apiToken) {
        const powResult = await PoWSolver.fetchChallenge();
        await PoWSolver.solve(powResult.challengeNonce, powResult.difficulty);
        const token = await PoWSolver.submitSolution();
        apiToken = token;
        window._fataApiToken = token;
        APIClient.setToken(token);
      }

      console.log('fata: submit-start');

      // Compute TF-IDF locally as API fallback
      const tfidfEmbedding = await MatchEngine._generateEmbedding(text);

      // Compute email hash (for rate limiting/dedup)
      const emailHash = await sha256(email);

      // Call Worker /api/submit (plaintext over HTTPS, Worker encrypts for storage)
      const result = await APIClient.call('/api/submit', {
        text, email, emailHash,
        lang: currentLang,
        allowSnippet: state.allowSnippet,
        tfidfEmbedding
      });

      // Clear draft on success
      sessionStorage.removeItem('fata_draft_text');
      sessionStorage.removeItem('fata_draft_email');

      state.lastMatchAttempt = { text, email };

      if (result.matched) {
        const resonance = result.resonance || { resonance: t('match.resonanceFallback'), questions: [t('match.icebreaker1'), t('match.icebreaker2'), t('match.icebreaker3')] };
        showMatchSuccess(result, resonance, text);
      } else {
        showNoMatch(result);
      }
    } catch (e) {
      console.error('fata: submit failed', {
        name: e.name,
        message: e.message,
        cause: e.cause?.message || e.cause,
        stack: e.stack?.slice(0, 400)
      });
      const errStr = (e.message || '') + (e.cause ? ' ' + e.cause : '');
      const isRateLimited = errStr.includes('rate_limited') || errStr.includes('429');
      const isTimeout = errStr.includes('timeout') || errStr.includes('AbortError');
      const isRetryable = !isRateLimited && (
        isTimeout ||
        errStr.includes('Failed to fetch') ||
        errStr.includes('Load failed') ||
        errStr.includes('issue_create_failed') ||
        errStr.includes('storage_failed') ||
        errStr.includes('502') ||
        errStr.includes('503')
      );
      showMatchError({
        message: isRateLimited ? t('error.rateLimited') : (isRetryable ? t('submit.retryable') : t('error.network')),
        retryable: isRetryable || isRateLimited,
        cooldownSeconds: isRateLimited ? 60 : 0,
        rateLimited: isRateLimited,
        timeout: isTimeout && !isRateLimited
      });
    }
  }

  // ===== 匹配流程 =====

  // 将用户文字创建为 pending GitHub Issue（入匹配池）
  async function createPendingIssue(text, email, intentProfile) {
    const embedding = await MatchEngine._generateEmbedding(text);
    const embEncrypted = await encryptData(embedding);
    const emailEncrypted = await encryptEmail(email);
    const emailHash = await sha256(email);
    const snippet = text.length > 300 ? text.slice(0, 300) : text;

    const body = JSON.stringify({
      l: currentLang,
      e: embEncrypted,
      m: emailEncrypted,
      h: emailHash,
      et: MatchEngine.embeddingType || 'tfidf',
      text_snippet: snippet,
      allow_snippet: state.allowSnippet,
      ...(intentProfile ? { i: await encryptData(intentProfile) } : {})
    });

    const endpoint = '/api/github/issues';
    const hmacHeaders = _buildTokenHeaders();
    const resp = await fetch(API_BASE + endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...hmacHeaders },
      body: JSON.stringify({ title: snippet.slice(0, 30), body, labels: ['pending'] })
    });

    if (!resp.ok) {
      const errText = await resp.text();
      throw new Error('createPendingIssue failed: ' + resp.status + ' ' + errText);
    }

    const issue = await resp.json();
    return { issueNumber: issue.number, embedding, _match: issue._match || null };
  }

  // v3: Simplified match — Worker handles everything via /api/submit
  async function executeMatch(text, email) {
    try {
      showWaiting(t('submit.sending') || t('waiting.feeling'));

      // Run PoW if no valid token
      if (!apiToken) {
        const powResult = await PoWSolver.fetchChallenge();
        await PoWSolver.solve(powResult.challengeNonce, powResult.difficulty);
        const token = await PoWSolver.submitSolution();
        apiToken = token;
        window._fataApiToken = token;
        APIClient.setToken(token);
      }

      const tfidfEmbedding = await MatchEngine._generateEmbedding(text);
      const emailHash = await sha256(email);

      const result = await APIClient.call('/api/submit', {
        text, email, emailHash,
        lang: currentLang, allowSnippet: state.allowSnippet, tfidfEmbedding
      });


      state.lastMatchAttempt = { text, email };

      if (result.matched) {
        const resonance = result.resonance || { resonance: t('match.resonanceFallback'), questions: [t('match.icebreaker1'), t('match.icebreaker2'), t('match.icebreaker3')] };
        showMatchSuccess(result, resonance, text);
      } else {
        showNoMatch(result);
      }
    } catch (err) {
      console.error('fata: executeMatch failed', { name: err.name, message: err.message, cause: err.cause?.message || err.cause });
      const errStr = (err.message || '') + (err.cause ? ' ' + err.cause : '');
      const isRateLimited = errStr.includes('rate_limited') || errStr.includes('429');
      const isTimeout = errStr.includes('timeout') || errStr.includes('AbortError');
      const isRetryable = !isRateLimited && (
        isTimeout ||
        errStr.includes('Failed to fetch') ||
        errStr.includes('Load failed') ||
        errStr.includes('issue_create_failed') ||
        errStr.includes('storage_failed') ||
        errStr.includes('502') ||
        errStr.includes('503')
      );
      showMatchError({
        message: isRateLimited ? t('error.rateLimited') : (isRetryable ? t('submit.retryable') : t('error.network')),
        retryable: isRetryable || isRateLimited,
        cooldownSeconds: isRateLimited ? 60 : 0,
        rateLimited: isRateLimited,
        timeout: isTimeout && !isRateLimited
      });
    }
  }

  // 用户主动撤回 pending 文字
  async function deletePendingText(id, issueNumber) {
    try {
      // 关闭 GitHub Issue
      const endpoint = '/api/github/issues/' + issueNumber;
      const headers = _buildTokenHeaders();
      const resp = await fetch(API_BASE + endpoint, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', ...headers },
        body: JSON.stringify({ state: 'closed' })
      });
      if (!resp.ok) throw new Error('Close issue failed: ' + resp.status);

      // 从本地状态移除
      state.pendingTexts = state.pendingTexts.filter(t => t.id !== id);

      // 重新持久化到 IndexedDB
      await rewriteHistory(state.pendingTexts);

      // 刷新界面
      renderReturningHome(document.getElementById('app'));
    } catch (e) {
      console.error('fata: deletePendingText failed', e);
      alert(t('delete.failed'));
    }
  }

  // 重写 IndexedDB 中的历史记录
  async function rewriteHistory(items) {
    try {
      const DB_NAME = 'fata_user_data';
      return new Promise((resolve) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onsuccess = () => {
          const db = request.result;
          const tx = db.transaction('fata_history', 'readwrite');
          const store = tx.objectStore('fata_history');
          store.clear();
          for (const item of items) {
            store.put(item);
          }
          tx.oncomplete = () => resolve();
        };
        request.onerror = () => resolve();
      });
    } catch (e) { /* ignore */ }
  }

  // 匹配成功后：关闭双方的 pending issue，创建 match issue
  async function closeMatchedIssues(userIssueNumber, matchedNumber, userText, userSnippet, matchedSnippet) {
    // 每次请求单独生成 HMAC 签名，因为路径不同
    const closeUserHeaders = _buildTokenHeaders();
    // 关闭用户自己的 issue
    await fetch(API_BASE + '/api/github/issues/' + userIssueNumber, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', ...closeUserHeaders },
      body: JSON.stringify({ state: 'closed' })
    });

    // 关闭匹配到的 issue
    if (matchedNumber && matchedNumber !== userIssueNumber) {
      const closeMatchHeaders = _buildTokenHeaders();
      await fetch(API_BASE + '/api/github/issues/' + matchedNumber, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', ...closeMatchHeaders },
        body: JSON.stringify({ state: 'closed' })
      });
    }

    // 创建 match issue（记录匹配事件，不存用户原文）
    const matchBody = JSON.stringify({
      user_issue: userIssueNumber,
      matched_issue: matchedNumber,
      similarity: 0,
      matched_at: Date.now()
    });
    const matchHeaders = _buildTokenHeaders();
    const matchResp = await fetch(API_BASE + '/api/github/issues', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...matchHeaders },
      body: JSON.stringify({
        title: 'Match-' + userIssueNumber + '-' + matchedNumber,
        body: matchBody,
        labels: ['matched']
      })
    });
    if (matchResp.ok) {
      const matchIssue = await matchResp.json();
      return matchIssue.number;
    }
    return null;
  }

  function showMatchError(err, stack) {
    const errObj = (err && typeof err === 'object') ? err : { message: String(err || ''), retryable: true };
    const retryable = errObj.retryable !== false;
    const cooldown = errObj.cooldownSeconds || 0;
    const isRateLimited = errObj.rateLimited === true;
    const isTimeout = errObj.timeout === true;
    // Caller-provided message takes priority over generic text
    const callerMsg = (errObj && typeof errObj.message === 'string' && errObj.message) || '';

    let mainText, subText;
    if (isRateLimited) {
      mainText = t('error.rateLimited');
      subText = t('error.rateLimitedDesc').replace('{n}', String(cooldown));
    } else if (isTimeout) {
      mainText = t('error.timeout');
      subText = t('error.timeoutDesc');
    } else if (retryable) {
      mainText = callerMsg || t('error.transient');
      subText = callerMsg ? '' : t('error.transientDesc');
    } else {
      mainText = callerMsg || t('error.network');
      subText = callerMsg ? '' : t('error.networkDesc');
    }

    const btnId = 'btn-retry-' + Date.now();
    document.getElementById('app').innerHTML = `
      <div class="no-match">
        <p class="no-match-main">${mainText}</p>
        <p class="no-match-sub" id="retry-sub-text">${subText}</p>
        <div class="actions-row" style="margin-top:24px;">
          <button class="btn-email" id="${btnId}" ${cooldown > 0 ? 'disabled style="opacity:0.5;cursor:not-allowed"' : ''}>${cooldown > 0 ? t('error.retry') + ' (' + cooldown + 's)' : t('error.retry')}</button>
          <button class="btn-secondary" onclick="fata.renderHome()">${t('error.back')}</button>
        </div>
      </div>
    `;

    // Cooldown timer
    if (cooldown > 0) {
      let remaining = cooldown;
      const btn = document.getElementById(btnId);
      const subEl = document.getElementById('retry-sub-text');
      const timer = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          clearInterval(timer);
          if (btn) { btn.disabled = false; btn.style.opacity = ''; btn.style.cursor = ''; btn.textContent = t('error.retry'); }
          if (subEl) subEl.textContent = isRateLimited
            ? t('error.rateLimitedDesc').replace('{n}', String(cooldown))
            : subText;
        } else {
          if (btn) btn.textContent = t('error.retry') + ' (' + remaining + 's)';
          if (subEl && isRateLimited) subEl.textContent = t('error.rateLimitedDesc').replace('{n}', String(remaining));
        }
      }, 1000);
      if (btn) btn.addEventListener('click', () => { clearInterval(timer); fata.retryMatch(); });
    } else if (retryable) {
      document.getElementById(btnId).addEventListener('click', fata.retryMatch);
    }
  }

  async function encryptData(data) {
    // 使用 AES-256-GCM 加密，密钥从 DATA_ENCRYPTION_KEY 派生
    try {
      const encoder = new TextEncoder();
      const plaintext = JSON.stringify(data);
      const keyData = encoder.encode(DATA_ENCRYPTION_KEY).slice(0, 32); // 256-bit
      const key = await crypto.subtle.importKey('raw', keyData,
        { name: 'AES-GCM' }, false, ['encrypt']);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ciphertext = await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv },
        key,
        encoder.encode(plaintext)
      );
      const combined = new Uint8Array(iv.length + ciphertext.byteLength);
      combined.set(iv);
      combined.set(new Uint8Array(ciphertext), iv.length);
      return btoa(String.fromCharCode(...combined));
    } catch (e) {
      console.error('fata: encryptData failed', e);
      throw e;
    }
  }

  async function decryptAES(encrypted, keyBytes) {
    // 与 Worker 端 decryptAES 格式一致: base64(iv(12字节) + ciphertext)
    try {
      const raw = Uint8Array.from(atob(encrypted), c => c.charCodeAt(0));
      const iv = raw.slice(0, 12);
      const ct = raw.slice(12);
      const key = await crypto.subtle.importKey('raw', keyBytes, { name: 'AES-GCM' }, false, ['decrypt']);
      const dec = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
      const text = new TextDecoder().decode(dec);
      try { return JSON.parse(text); } catch { return text; }
    } catch (e) {
      console.error('fata: decryptAES failed', e);
      throw e;
    }
  }

  function getEchoSnippet() {

    const candidates = langPool.length > 0 ? langPool : pool;
    if (candidates.length > 0) {
      const idx = Math.floor(Math.random() * candidates.length);
      const entry = candidates[idx];
      return typeof entry === 'string' ? entry : entry.text;
    }
    return t('echo.fallback');
  }

  async function sha256(message) {
    const encoder = new TextEncoder();
    const data = encoder.encode(message);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }

          const db = event.target.result;
          if (!db.objectStoreNames.contains(storeName)) {
            db.createObjectStore(storeName, { keyPath: 'id', autoIncrement: true });
          }
        };
        request.onsuccess = () => {
          const db = request.result;
          const tx = db.transaction(storeName, 'readonly');
          const store = tx.objectStore(storeName);
          const getAll = store.getAll();
          getAll.onsuccess = () => resolve(getAll.result || []);
          getAll.onerror = () => resolve([]);
        };
        request.onerror = () => resolve([]);
      });
    } catch (e) {
      console.warn('fata: loadFromIndexedDB failed', e);
      return [];
    }
  }

  async function saveToIndexedDB(storeName, entry) {
    try {
      const DB_NAME = 'fata_user_data';
      return new Promise((resolve) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains(storeName)) {
            db.createObjectStore(storeName, { keyPath: 'id', autoIncrement: true });
          }
        };
        request.onsuccess = () => {
          const db = request.result;
          const tx = db.transaction(storeName, 'readwrite');
          const store = tx.objectStore(storeName);
          store.put(entry);
          tx.oncomplete = () => resolve();
          request.onerror = () => resolve();
        };
        request.onerror = () => resolve();
      });
    } catch (e) {
      console.warn('fata: saveToIndexedDB failed', e);
    }
  }

  // ===== 暴露 API =====
  window.fata = {
    renderHome,
    showWritePage: () => renderHome(),
    showHistory: () => { state.isReturningUser = true; renderHome(); },
    expandEditor: (text) => {
      if (typeof text === 'string' && text) {
        setTimeout(() => {
          const ta = document.getElementById('user-text');
          if (ta) ta.value = text;
        }, 0);
      }
      renderHome();
    },
    forceSubmit: () => handleDeliver(),
    saveAsDraft: (text) => {
      const txt = typeof text === 'string' && text
        ? text
        : (document.getElementById('user-text')?.value || '');
      LowSignalGuide.saveDraft(txt);
    },
    submit: handleDeliver,
    retryMatch: () => {
      // Recover draft from sessionStorage
      const draftText = sessionStorage.getItem('fata_draft_text');
      const draftEmail = sessionStorage.getItem('fata_draft_email');
      // Render home first so textarea exists
      renderHome();
      if (draftText) {
        setTimeout(() => {
          const ta = document.getElementById('user-text');
          if (ta) ta.value = draftText;
        }, 50);
        state.lastMatchAttempt = { text: draftText, email: draftEmail };
        setTimeout(() => executeMatch(draftText, draftEmail), 100);
      }
    },
    ui: {
      showWritePage: () => renderHome(),
      showHistory: () => { state.isReturningUser = true; renderHome(); },
      expandEditor: (text) => {
        if (typeof text === 'string' && text) {
          setTimeout(() => {
            const ta = document.getElementById('user-text');
            if (ta) ta.value = text;
          }, 0);
        }
        renderHome();
      },
      forceSubmit: () => handleDeliver(),
      saveAsDraft: () => {
        const txt = document.getElementById('user-text')?.value || '';
        LowSignalGuide.saveDraft(txt);
      }
    }
  };

  // ===== 启动 =====
  init().catch(err => {
    console.error('fata init error:', err);
    document.getElementById('app').innerHTML = `
      <div style="text-align:center;padding-top:80px;">
        <p>Something went wrong. Please refresh.</p>
        <p style="font-size:12px;color:#999;margin-top:16px;">${err.message || 'unknown'}</p>
        <pre style="font-size:10px;color:#ccc;margin-top:8px;max-width:100%;overflow:auto;">${(err.stack || '').slice(0, 500)}</pre>
      </div>
    `;
  });
</script>

</body>
